{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="mt-5">
    <div class="row">
        <div class="col-md-8">
            <div class="card ">
                <div class="card-header bg-secondary text-white">
                    <h4 class="mb-0">Modifica Password</h4>
                </div>
                <div class="card-body">

                    <form method="POST">
                        {% csrf_token %}

                        {{ form|crispy }}

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a href="{% url 'home' %}" class="btn btn-secondary me-md-2">Annulla</a>
                            <button type="submit" class="btn btn-primary">Aggiorna Password</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
